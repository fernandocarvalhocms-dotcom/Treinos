<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><title>Controle de Aulas</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}main{max-width:760px;margin:auto;padding:16px 14px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:1px solid var(--border);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.cards,.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px}.big{font-size:26px;font-weight:800}.muted{font-size:13px;color:var(--muted)}.total{margin:12px 0;background:#0f172a;color:#fff;border-radius:16px;padding:16px}.lesson{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.s{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 6px;font-size:12px;font-weight:700}.active.done{background:#dcfce7}.active.cancelled{background:#fee2e2}.active.pending{background:#fef3c7}.active.replacement{background:#ede9fe}input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-top:5px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools .btn{flex:1;min-width:140px}.details{display:none;margin-top:10px}.lesson.open .details{display:block}.summary{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;line-height:1.5}.primary{background:var(--accent);color:#fff;border:none}@media(max-width:520px){.cards,.settings{grid-template-columns:1fr}.status{grid-template-columns:1fr 1fr}}
</style>
</head><body><main>
<div class="top"><button class="btn" id="prev">←</button><div style="text-align:center"><div class="muted">Controle mensal</div><h1 id="title" style="font-size:22px;margin:4px 0"></h1></div><button class="btn" id="next">→</button></div>
<div class="cards"><section class="card"><b>🎾 Tênis</b><div class="big" id="tc">0 / 0</div><div class="muted">realizadas / previstas</div><div id="tv" style="margin-top:8px;font-weight:700"></div></section><section class="card"><b>🏋️ Academia</b><div class="big" id="gc">0 / 0</div><div class="muted">realizadas / previstas</div><div id="gv" style="margin-top:8px;font-weight:700"></div></section></div>
<section class="total"><div class="muted" style="color:#cbd5e1">TOTAL DEVIDO NO MÊS</div><div class="big" id="total"></div></section>
<div class="settings"><label>Valor por aula — Tênis<input id="tp" inputmode="decimal"></label><label>Valor por aula — Academia<input id="gp" inputmode="decimal"></label></div>
<div class="tools"><button class="btn" id="share">Compartilhar fechamento</button><button class="btn" id="export">Exportar backup</button><label class="btn" style="text-align:center;cursor:pointer">Importar backup<input id="import" type="file" accept="application/json" style="display:none"></label></div>
<div class="row" style="margin-top:18px"><h2 style="font-size:18px;margin:0">Aulas do mês</h2><span class="muted">toque para registrar</span></div><div id="list"></div><div class="summary" id="summary"></div>
</main>
<script>
(()=>{const K='controle_aulas_v1',D={tennis:[2,4],gym:[3,5]},n=new Date();let y=n.getFullYear(),m=n.getMonth();let st=load();function def(){return{prices:{tennis:150,gym:100},months:{}}}function load(){try{return Object.assign(def(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){return def()}}function save(){localStorage.setItem(K,JSON.stringify(st))}function mk(){return y+'-'+String(m+1).padStart(2,'0')}function dk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function md(){return st.months[mk()]||(st.months[mk()]={})}function ls(d){return md()[dk(d)]||(md()[dk(d)]={status:'pending',cancelBy:'',note:''})}function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0)}function month(){return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(y,m,1))}function lessons(){let a=[],last=new Date(y,m+1,0).getDate();for(let day=1;day<=last;day++){let d=new Date(y,m,day);if(D.tennis.includes(d.getDay()))a.push({d,type:'tennis'});if(D.gym.includes(d.getDay()))a.push({d,type:'gym'})}return a}function stats(){let s={tennis:{t:0,d:0,c:0,p:0,r:0},gym:{t:0,d:0,c:0,p:0,r:0}};lessons().forEach(i=>{let g=s[i.type],x=ls(i.d);g.t++;x.status==='done'?g.d++:x.status==='cancelled'?g.c++:x.status==='replacement'?g.r++:g.p++});s.tennis.v=(s.tennis.d+s.tennis.r)*st.prices.tennis;s.gym.v=(s.gym.d+s.gym.r)*st.prices.gym;s.total=s.tennis.v+s.gym.v;return s}function render(){title.textContent=month();tp.value=String(st.prices.tennis).replace('.',',');gp.value=String(st.prices.gym).replace('.',',');list.innerHTML='';lessons().forEach(i=>{let x=ls(i.d),e=document.createElement('div');e.className='lesson';let wd=new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(i.d).replace('.','');e.innerHTML='<div class="row"><div><b>'+String(i.d.getDate()).padStart(2,'0')+'/'+String(m+1).padStart(2,'0')+' · '+wd+'</b><div class="muted">'+(i.type==='tennis'?'🎾 Tênis':'🏋️ Academia')+'</div></div><button class="btn det" style="padding:7px 9px">Detalhes</button></div><div class="status"><button class="s '+(x.status==='done'?'active done':'')+'" data-s="done">✅ Teve</button><button class="s '+(x.status==='cancelled'?'active cancelled':'')+'" data-s="cancelled">❌ Não teve</button><button class="s '+(x.status==='pending'?'active pending':'')+'" data-s="pending">⏳ Pendente</button><button class="s '+(x.status==='replacement'?'active replacement':'')+'" data-s="replacement">🔄 Reposição</button></div><div class="details"><label>Quem cancelou<select class="cb"><option value="">—</option><option>Eu</option><option>Professor</option><option>Academia</option><option>Clima</option><option>Outro</option></select></label><label>Observação<textarea class="note" rows="2">'+(x.note||'')+'</textarea></label></div>';e.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{x.status=b.dataset.s;save();render()});e.querySelector('.det').onclick=()=>e.classList.toggle('open');let cb=e.querySelector('.cb');cb.value=x.cancelBy||'';cb.onchange=()=>{x.cancelBy=cb.value;save()};e.querySelector('.note').oninput=a=>{x.note=a.target.value;save()};list.appendChild(e)});let s=stats();tc.textContent=s.tennis.d+' / '+s.tennis.t;gc.textContent=s.gym.d+' / '+s.gym.t;tv.textContent=money(s.tennis.v);gv.textContent=money(s.gym.v);total.textContent=money(s.total);summary.innerHTML='<b>Resumo de '+month()+'</b><br><br>🎾 Tênis: '+s.tennis.t+' previstas · '+s.tennis.d+' realizadas · '+s.tennis.c+' não realizadas · '+s.tennis.p+' pendentes · '+s.tennis.r+' reposições.<br>🏋️ Academia: '+s.gym.t+' previstas · '+s.gym.d+' realizadas · '+s.gym.c+' não realizadas · '+s.gym.p+' pendentes · '+s.gym.r+' reposições.<br><br><b>Total devido: '+money(s.total)+'</b>';save()}prev.onclick=()=>{m--;if(m<0){m=11;y--}render()};next.onclick=()=>{m++;if(m>11){m=0;y++}render()};tp.onchange=e=>{st.prices.tennis=+e.target.value.replace(',','.')||0;save();render()};gp.onchange=e=>{st.prices.gym=+e.target.value.replace(',','.')||0;save();render()};share.onclick=async()=>{let s=stats(),text='Fechamento - '+month()+'\nTênis: '+s.tennis.d+' realizadas — '+money(s.tennis.v)+'\nAcademia: '+s.gym.d+' realizadas — '+money(s.gym.v)+'\nTOTAL: '+money(s.total);if(navigator.share)try{await navigator.share({title:'Fechamento de aulas',text})}catch(e){}else alert(text)};export.onclick=()=>{let b=new Blob([JSON.stringify(st,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='backup-controle-aulas.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};document.getElementById('import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{st=JSON.parse(r.result);save();render();alert('Backup importado com sucesso.')}catch(x){alert('Backup inválido.')}};r.readAsText(f)};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));render()})();
</script></body></html>
