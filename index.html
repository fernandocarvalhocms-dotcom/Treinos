<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Treinos</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--yes:#15803d;--no:#b91c1c;--pending:#a16207;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}main{max-width:760px;margin:auto;padding:16px 14px 40px}.header{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px}.nav{height:46px;border:1px solid var(--border);background:#fff;border-radius:12px;font-size:22px;font-weight:700}.month{text-align:center}.month h1{margin:2px 0;font-size:22px;text-transform:capitalize}.muted{font-size:13px;color:var(--muted)}.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.box,.summary,.session{background:#fff;border:1px solid var(--border);border-radius:15px;padding:13px}.box label{font-size:12px;color:var(--muted);font-weight:700}.box input{width:100%;margin-top:7px;border:1px solid var(--border);border-radius:10px;padding:10px;font-size:17px}.totalBox{background:#111827;color:white;border-radius:16px;padding:16px;margin-bottom:15px}.totalBox small{color:#cbd5e1}.totalValue{font-size:30px;font-weight:800;margin-top:4px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.stat{min-width:0}.stat .name{font-weight:800}.stat .line{font-size:13px;color:var(--muted);margin-top:6px}.stat .value{font-size:20px;font-weight:800;margin-top:7px}.titleRow{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:18px 0 8px}.titleRow h2{font-size:18px;margin:0}.session{margin-bottom:9px}.sessionTop{display:flex;align-items:center;justify-content:space-between;gap:10px}.date{font-weight:800}.activity{font-size:13px;color:var(--muted);margin-top:3px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.choice{min-height:44px;border:1px solid var(--border);border-radius:10px;background:#fff;font-weight:800;font-size:13px}.choice.active.yes{background:#dcfce7;border-color:#86efac;color:#166534}.choice.active.no{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.choice.active.pending{background:#fef3c7;border-color:#fcd34d;color:#92400e}.saved{font-size:12px;color:#15803d;font-weight:700}.footerBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.footerBtns button{flex:1;min-width:150px;min-height:44px;border:1px solid var(--border);background:#fff;border-radius:11px;font-weight:700}@media(max-width:520px){.prices,.summary{grid-template-columns:1fr 1fr}.buttons{grid-template-columns:repeat(3,1fr)}.choice{font-size:12px;padding:8px 4px}}
</style>
</head>
<body>
<main>
  <div class="header">
    <button class="nav" id="prevMonth" aria-label="Mês anterior">‹</button>
    <div class="month"><div class="muted">CONTROLE DE TREINOS</div><h1 id="monthTitle"></h1></div>
    <button class="nav" id="nextMonth" aria-label="Próximo mês">›</button>
  </div>

  <div class="prices">
    <div class="box"><label>Valor por aula de Tênis</label><input id="tennisPrice" inputmode="decimal" placeholder="R$ 0,00"></div>
    <div class="box"><label>Valor por aula de Academia</label><input id="gymPrice" inputmode="decimal" placeholder="R$ 0,00"></div>
  </div>

  <div class="totalBox"><small>TOTAL DO MÊS</small><div class="totalValue" id="monthTotal">R$ 0,00</div></div>

  <div class="summary">
    <div class="stat"><div class="name">🎾 Tênis</div><div class="line" id="tennisSummary"></div><div class="value" id="tennisTotal"></div></div>
    <div class="stat"><div class="name">🏋️ Academia</div><div class="line" id="gymSummary"></div><div class="value" id="gymTotal"></div></div>
  </div>

  <div class="titleRow"><h2>Aulas previstas</h2><span class="saved" id="savedMsg">Salvo no aparelho</span></div>
  <div id="sessions"></div>

  <div class="footerBtns">
    <button id="currentMonth">Ir para mês atual</button>
    <button id="shareSummary">Compartilhar resumo</button>
    <button id="exportData">Backup</button>
  </div>
</main>
<script>
(function(){
'use strict';
const STORAGE='treinos_app_v2';
const SCHEDULE={tennis:[2,4],gym:[3,5]};
const names={tennis:'Tênis',gym:'Academia'};
const icons={tennis:'🎾',gym:'🏋️'};
const $=id=>document.getElementById(id);
const now=new Date();
let year=now.getFullYear(), month=now.getMonth();
let data=load();

function defaults(){return {prices:{tennis:0,gym:0},records:{}}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'null');return x&&x.prices&&x.records?x:defaults()}catch(e){return defaults()}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(data));$('savedMsg').textContent='✓ Salvo no aparelho'}
function ym(){return year+'-'+String(month+1).padStart(2,'0')}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0)}
function parsePrice(v){let s=String(v||'').trim().replace(/R\$/gi,'').replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)&&n>=0?n:0}
function monthLabel(){return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(year,month,1))}
function dayLabel(d){const wd=new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(d).replace('.','');return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' · '+wd}
function sessions(){const out=[];const last=new Date(year,month+1,0).getDate();for(let day=1;day<=last;day++){const d=new Date(year,month,day);if(SCHEDULE.tennis.includes(d.getDay()))out.push({date:d,type:'tennis'});if(SCHEDULE.gym.includes(d.getDay()))out.push({date:d,type:'gym'})}return out.sort((a,b)=>a.date-b.date)}
function getRecord(item){const m=ym();data.records[m]=data.records[m]||{};const k=key(item.date);data.records[m][k]=data.records[m][k]||{type:item.type,status:'pending'};return data.records[m][k]}
function setStatus(item,status){const r=getRecord(item);r.status=status;save();render()}
function counts(){const s={tennis:{planned:0,yes:0,no:0,pending:0,total:0},gym:{planned:0,yes:0,no:0,pending:0,total:0}};sessions().forEach(item=>{const r=getRecord(item),g=s[item.type];g.planned++;if(r.status==='yes')g.yes++;else if(r.status==='no')g.no++;else g.pending++});s.tennis.total=s.tennis.yes*data.prices.tennis;s.gym.total=s.gym.yes*data.prices.gym;s.total=s.tennis.total+s.gym.total;return s}
function render(){
  $('monthTitle').textContent=monthLabel();
  $('tennisPrice').value=data.prices.tennis?String(data.prices.tennis).replace('.',','):'';
  $('gymPrice').value=data.prices.gym?String(data.prices.gym).replace('.',','):'';
  const wrap=$('sessions');wrap.innerHTML='';
  sessions().forEach(item=>{
    const r=getRecord(item),el=document.createElement('div');el.className='session';
    el.innerHTML='<div class="sessionTop"><div><div class="date">'+dayLabel(item.date)+'</div><div class="activity">'+icons[item.type]+' '+names[item.type]+'</div></div></div><div class="buttons"><button type="button" class="choice yes '+(r.status==='yes'?'active yes':'')+'">✅ Fui</button><button type="button" class="choice no '+(r.status==='no'?'active no':'')+'">❌ Não fui</button><button type="button" class="choice pending '+(r.status==='pending'?'active pending':'')+'">⏳ Pendente</button></div>';
    const btns=el.querySelectorAll('.choice');btns[0].addEventListener('click',()=>setStatus(item,'yes'));btns[1].addEventListener('click',()=>setStatus(item,'no'));btns[2].addEventListener('click',()=>setStatus(item,'pending'));wrap.appendChild(el);
  });
  const s=counts();
  $('tennisSummary').textContent=s.tennis.yes+' fui · '+s.tennis.no+' não fui · '+s.tennis.pending+' pendentes';
  $('gymSummary').textContent=s.gym.yes+' fui · '+s.gym.no+' não fui · '+s.gym.pending+' pendentes';
  $('tennisTotal').textContent=money(s.tennis.total);$('gymTotal').textContent=money(s.gym.total);$('monthTotal').textContent=money(s.total);save();
}
function changeMonth(delta){month+=delta;if(month<0){month=11;year--}if(month>11){month=0;year++}render();window.scrollTo({top:0,behavior:'smooth'})}
$('prevMonth').addEventListener('click',()=>changeMonth(-1));
$('nextMonth').addEventListener('click',()=>changeMonth(1));
$('currentMonth').addEventListener('click',()=>{const d=new Date();year=d.getFullYear();month=d.getMonth();render();window.scrollTo({top:0,behavior:'smooth'})});
$('tennisPrice').addEventListener('change',e=>{data.prices.tennis=parsePrice(e.target.value);save();render()});
$('gymPrice').addEventListener('change',e=>{data.prices.gym=parsePrice(e.target.value);save();render()});
$('shareSummary').addEventListener('click',async()=>{const s=counts();const text='Resumo - '+monthLabel()+'\n🎾 Tênis: '+s.tennis.yes+' fui, '+s.tennis.no+' não fui, '+s.tennis.pending+' pendentes — '+money(s.tennis.total)+'\n🏋️ Academia: '+s.gym.yes+' fui, '+s.gym.no+' não fui, '+s.gym.pending+' pendentes — '+money(s.gym.total)+'\nTOTAL: '+money(s.total);if(navigator.share){try{await navigator.share({title:'Resumo de treinos',text:text})}catch(e){}}else{alert(text)}});
$('exportData').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='backup-treinos.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js').then(reg=>reg.update()).catch(()=>{})}
render();
})();
</script>
</body>
</html>
